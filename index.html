<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101215" />
    <link rel="icon" href="data:," />
    <title>A-SOUL场景</title>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="自由飞行场景。拖拽控制机头，WASD 飞行，R F 升降，Q E 侧倾。"></canvas>
    <div id="status" role="status" aria-live="polite">正在打开场景…</div>
    <section id="landscape-gate" hidden aria-labelledby="landscape-title">
      <div class="rotate-phone" aria-hidden="true">↻</div>
      <h1 id="landscape-title">请横屏浏览</h1>
      <p aria-live="polite">将手机横过来继续浏览。</p>
      <button type="button">进入横屏</button>
    </section>
    <div id="screen-controls" hidden>
      <div class="toolbar" role="group" aria-label="漫游设置">
        <button type="button" id="scene-toggle" aria-expanded="false" aria-controls="scene-list" hidden>场景</button>
        <button type="button" data-action="fullscreen" aria-label="进入全屏">全屏</button>
        <button type="button" data-action="home" aria-label="重置视角">重置</button>
      </div>
      <div id="scene-list" class="scene-list" hidden aria-label="选择场景"></div>
      <button type="button" class="boost-mode" data-toggle-key="ShiftLeft" aria-label="切换快速模式" aria-pressed="false"><span>快速</span><span class="mode-state" aria-hidden="true"></span></button>
      <div class="movement-panel">
        <div class="movement-buttons">
          <div class="dpad" role="group" aria-label="移动与侧倾">
            <button type="button" class="tilt-left" data-key="KeyQ" aria-label="向左侧倾" title="按住左倾 · Q">左倾<span aria-hidden="true">Q</span></button>
            <button type="button" class="forward" data-key="KeyW" aria-label="向前移动" title="按住前进 · W">↑<span aria-hidden="true">W</span></button>
            <button type="button" class="tilt-right" data-key="KeyE" aria-label="向右侧倾" title="按住右倾 · E">右倾<span aria-hidden="true">E</span></button>
            <button type="button" class="left" data-key="KeyA" aria-label="向左移动" title="按住左移 · A">←<span aria-hidden="true">A</span></button>
            <button type="button" class="back" data-key="KeyS" aria-label="向后移动" title="按住后退 · S">↓<span aria-hidden="true">S</span></button>
            <button type="button" class="right" data-key="KeyD" aria-label="向右移动" title="按住右移 · D">→<span aria-hidden="true">D</span></button>
          </div>
          <div class="elevation" role="group" aria-label="高度控制">
            <button type="button" data-key="KeyR" aria-label="上升" title="沿机身向上 · R">升<span aria-hidden="true">R</span></button>
            <button type="button" data-key="KeyF" aria-label="下降" title="沿机身向下 · F">降<span aria-hidden="true">F</span></button>
          </div>
        </div>
      </div>
      <div class="look-label" aria-hidden="true"><span>↔</span>右手拖拽转头</div>
      <p class="control-notice" role="status" aria-live="polite" hidden></p>
    </div>
    <p id="hint">拖拽控制机头 · WASD 飞行 · Q/E 侧倾 · R/F 升降 · Shift 加速</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
